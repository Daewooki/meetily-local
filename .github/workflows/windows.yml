name: Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: windows-local-cpu-${{ hashFiles('Cargo.lock', '.github/force-portable-ggml.cmake', 'scripts/build-local-windows.ps1') }}
          restore-keys: windows-local-cpu-
      - name: Check source snapshot
        run: python scripts/check-release-source.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make nasm diffutils tar mingw-w64-x86_64-gcc
      - name: Build local-only FFmpeg from verified source
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-local-windows.sh
      - name: Build and test the Windows application
        shell: pwsh
        run: ./scripts/build-local-windows.ps1
      - name: Test the installed application
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Package corresponding source and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe release-artifacts/
          Copy-Item target/release-deps/ffmpeg-8.0.3.tar.xz release-artifacts/
          Copy-Item scripts/build-ffmpeg-local-windows.sh release-artifacts/
          Copy-Item THIRD_PARTY_NOTICES.md release-artifacts/
          Compress-Archive frontend/src-tauri/licenses/* release-artifacts/dependency-notices-windows.zip
          $hashes = Get-ChildItem release-artifacts -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $hashes | Set-Content release-artifacts/SHA256SUMS-windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: meetily-local-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@v4
        if: ${{ always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
